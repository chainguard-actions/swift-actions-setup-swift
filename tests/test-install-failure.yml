name: Test action fails when installation prerequisites fail
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake swift (wrong version) and failing sudo
        run: |
          mkdir -p "$RUNNER_TEMP/fakebin"
          cat > "$RUNNER_TEMP/fakebin/swift" <<'EOF'
          #!/bin/sh
          echo "Swift version 5.9.2 (swift-5.9.2-RELEASE)"
          EOF
          chmod +x "$RUNNER_TEMP/fakebin/swift"
          cat > "$RUNNER_TEMP/fakebin/sudo" <<'EOF'
          #!/bin/sh
          echo "fake sudo: simulated failure" >&2
          exit 1
          EOF
          chmod +x "$RUNNER_TEMP/fakebin/sudo"
          echo "$RUNNER_TEMP/fakebin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        with:
          swift-version: "6.0.3"
      - name: Assert action failed without setting version
        env:
          ACTUAL: ${{ steps.action.outputs.version }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "actual: $ACTUAL"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected the action to fail"
            exit 1
          fi
          if [ -n "$ACTUAL" ]; then
            echo "FAIL: version output should be empty on failure"
            exit 1
          fi
          echo "PASS"
