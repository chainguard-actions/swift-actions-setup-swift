name: Test default swift version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure installer prerequisites (file, gpg, swift runtime libs)
        run: |
          SUDO=""
          if [ "$(id -u)" != "0" ] && command -v sudo >/dev/null 2>&1; then SUDO="sudo"; fi
          export DEBIAN_FRONTEND=noninteractive
          $SUDO apt-get update -y || true
          $SUDO apt-get install -y --no-install-recommends file gnupg dirmngr ca-certificates \
            binutils libc6-dev libcurl4 libedit2 libsqlite3-0 libxml2 libncurses6 libpython3-dev \
            libz3-dev zlib1g-dev tzdata || true
      - id: action
        uses: .
      - name: Assert version output
        env:
          ACTUAL: ${{ steps.action.outputs.version }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "6.1" ]; then
            echo "FAIL: expected '6.1' (default 6.1.0 normalized)"
            exit 1
          fi
          echo "PASS"
      - name: Assert swift on PATH reports the version
        run: |
          OUT="$(swift --version 2>&1)"
          echo "$OUT"
          if ! echo "$OUT" | grep -q "Swift version 6.1"; then
            echo "FAIL: swift --version did not report 6.1"
            exit 1
          fi
          echo "PASS"
