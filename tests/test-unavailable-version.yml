name: Test unavailable swift version fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          swift-version: '99.0'
      - name: Assert action failed and set no output
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ACTUAL: ${{ steps.action.outputs.version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "version: $ACTUAL"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for unavailable version"
            exit 1
          fi
          if [ -n "$ACTUAL" ]; then
            echo "FAIL: expected no version output"
            exit 1
          fi
          echo "PASS"
