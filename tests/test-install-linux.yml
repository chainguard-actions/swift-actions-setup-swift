name: Test real Swift install on Linux
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          swift-version: "6.0.3"
          skip-verify-signature: "true"
      - name: Assert version output
        env:
          ACTUAL: ${{ steps.action.outputs.version }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "6.0.3" ]; then
            echo "FAIL: expected '6.0.3'"
            exit 1
          fi
          echo "PASS"
      - name: Assert swift is on PATH with the right version
        run: |
          OUT="$(swift --version 2>&1)"
          echo "$OUT"
          if ! echo "$OUT" | grep -q "Swift version 6.0.3"; then
            echo "FAIL: swift --version did not report 6.0.3"
            exit 1
          fi
          echo "PASS"
